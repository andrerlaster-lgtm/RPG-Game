<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAY — character review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172029;color:#eee7da;font:14px system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:absolute;top:28px;left:32px;pointer-events:none}small{letter-spacing:3px;color:#c5ac7d}h1{font:42px Georgia;margin:8px 0}p{color:#bac2c8;max-width:530px;line-height:1.5}nav{position:absolute;left:28px;right:28px;bottom:25px;display:flex;flex-wrap:wrap;gap:8px}button{background:#24323bee;border:1px solid #607078;border-radius:5px;color:#eee7da;padding:11px 16px;cursor:pointer}button[aria-pressed=true]{background:#6a5433;border-color:#d2b77f}#labels{position:absolute;top:84%;left:0;right:0;display:none;justify-content:space-evenly;color:#ead5af}#credit{position:absolute;right:26px;top:28px;font-size:11px;text-align:right;color:#a6b1b7;max-width:240px;line-height:1.6}a{color:inherit}
</style>
<header><small>BELLEMORNE · VISUAL DEVELOPMENT</small><h1>ZAY</h1><p id="status">Loading character…</p></header>
<div id="credit">Temporary Shadow rogue by Grigory Petrov<br>AI-assisted third-party asset · adapted for Bellemorne<br><a href="../docs/graphics/zay-shadow-rogue.md">Provenance and limitations</a></div>
<div id="labels"><span>Previous prototype</span><span>Replacement mesh + PBR</span></div>
<nav><button data-view="full">Full body</button><button data-view="face">Face & clothing</button><button data-view="back">Back</button><button data-view="compare">Before / after</button><button data-role="idle">Idle</button><button data-role="walk">Walk</button><button data-role="run">Run</button><button data-role="attack">Combat</button><button data-role="throw">Card throw</button><button data-role="dodge">Dodge</button><button id="pause">Pause</button></nav>
<canvas></canvas>
<script type="module">
import * as THREE from '../vendor/three/three.module.min.js';
import {loadHero,HERO} from '../hero3d.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#172029');scene.fog=new THREE.Fog('#172029',8,20);
const camera=new THREE.PerspectiveCamera(32,1,.01,50);
scene.add(new THREE.HemisphereLight(0xd5e2f5,0x776553,1.7));
const key=new THREE.DirectionalLight(0xffe4c5,2.7);key.position.set(2,4,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-3;key.shadow.camera.right=3;key.shadow.camera.top=3;key.shadow.camera.bottom=-3;key.shadow.normalBias=.008;scene.add(key);
const rim=new THREE.DirectionalLight(0xb8d4ff,2);rim.position.set(-2,3,-3);scene.add(rim);
const fill=new THREE.DirectionalLight(0xe5edf9,.8);fill.position.set(-3,1,2);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x263039,roughness:.85}));floor.rotation.x=-Math.PI/2;floor.position.y=-.006;floor.receiveShadow=true;scene.add(floor);
const hero=await loadHero({...HERO,url:'../'+HERO.url,rotationY:0,height:1.8});scene.add(hero.group);
const previous=await loadHero({...HERO,url:'../models/zay/zay-mock.glb',rotationY:0,height:1.8,rootMotionNodes:['Root'],probeBones:{leg:'thigh_l',root:'Root'},clips:{idle:'Idle',walk:'Walking_A',run:'Running_A',attack:'Dualwield_Melee_Attack_Slice',throw:'Throw',dodge:'Dodge_Forward'}});scene.add(previous.group);previous.group.visible=false;
let view='full',role='idle',paused=false,yaw=.3,pitch=.03,distance=4.4,targetY=.94,pointer=null;
function setView(value){view=value;hero.group.position.x=value==='compare'?.65:0;previous.group.position.x=-.65;previous.group.visible=value==='compare';yaw=value==='back'?Math.PI+.3:.3;pitch=.03;distance=value==='face'?1.65:value==='compare'?5.4:4.4;targetY=value==='face'?1.5:.94;document.querySelector('#labels').style.display=value==='compare'?'flex':'none';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===value));}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;if(!['idle','walk','run'].includes(role)){hero.play(role);previous.play(role);}document.querySelectorAll('[data-role]').forEach(btn=>btn.setAttribute('aria-pressed',btn===b));});
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume':'Pause';};
renderer.domElement.onpointerdown=e=>{pointer=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId);};
renderer.domElement.onpointermove=e=>{if(pointer){yaw-=(e.clientX-pointer[0])*.008;pitch=Math.max(-.5,Math.min(.7,pitch+(e.clientY-pointer[1])*.004));pointer=[e.clientX,e.clientY];}};
renderer.domElement.onpointerup=renderer.domElement.onpointercancel=()=>pointer=null;
renderer.domElement.onwheel=e=>{e.preventDefault();distance=Math.max(1,Math.min(7,distance+e.deltaY*.003));};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}onresize=resize;resize();setView('full');
document.querySelector('#status').textContent='Actual game mesh · layered leather & cloth · 2K PBR maps\nDrag to orbit · scroll to zoom';
let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){const speed=role==='walk'?118:role==='run'?185:0;hero.update(dt,speed,{dashT:0});previous.update(dt,speed,{dashT:0});}camera.position.set(Math.sin(yaw)*distance,targetY+Math.sin(pitch)*distance,Math.cos(yaw)*distance);camera.lookAt(0,targetY,0);renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.characterReview={hero,previous,renderer,setView,scene,camera,pause:()=>paused=true};
</script></html>
